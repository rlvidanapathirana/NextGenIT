<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NextGenIT AI Hub</title>
  <meta name="description" content="Sign in to NextGenIT AI Hub to access AI tools, updates, and resources.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4ff;
      --bg2: #ffffff;
      --bg3: #e8eeff;
      --card: #ffffff;
      --border: #d0d8f0;
      --text: #1a1a3e;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent2: #7c3aed;
      --accent3: #0ea5e9;
      --green: #10b981;
      --red: #ef4444;
      --shadow: 0 8px 40px rgba(79, 70, 229, 0.15);
      --radius: 20px;
    }

    [data-theme="dark"] {
      --bg: #0d0d1f;
      --bg2: #13132b;
      --bg3: #1a1a38;
      --card: #181832;
      --border: rgba(79, 70, 229, 0.25);
      --text: #e8e8ff;
      --muted: #8888bb;
      --shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background .3s, color .3s;
      position: relative;
      overflow: hidden;
    }

    /* ── Animated background blobs ── */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: blobFloat 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    .blob1 {
      width: 500px;
      height: 500px;
      background: #4f46e5;
      top: -150px;
      left: -150px;
      animation-delay: 0s;
    }

    .blob2 {
      width: 400px;
      height: 400px;
      background: #7c3aed;
      bottom: -100px;
      right: -100px;
      animation-delay: 3s;
    }

    .blob3 {
      width: 250px;
      height: 250px;
      background: #0ea5e9;
      top: 40%;
      left: 50%;
      animation-delay: 5s;
    }

    @keyframes blobFloat {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(30px, 20px) scale(1.08);
      }
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      box-shadow: var(--shadow);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      transform: rotate(20deg);
    }

    /* ── Login card ── */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .login-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 44px 40px 36px;
      box-shadow: var(--shadow);
      transition: all .3s;
    }

    .login-card.shake {
      animation: shake .45s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translateX(-4px);
      }

      20%,
      80% {
        transform: translateX(6px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-8px);
      }

      40%,
      60% {
        transform: translateX(8px);
      }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 66px;
      height: 66px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
      animation: iconPulse 2.5s ease-in-out infinite;
    }

    @keyframes iconPulse {

      0%,
      100% {
        box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
      }

      50% {
        box-shadow: 0 8px 36px rgba(124, 58, 237, 0.6);
      }
    }

    .logo-area h1 {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .logo-area h1 span {
      color: var(--accent);
    }

    .logo-area p {
      font-size: .84rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: .78rem;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: var(--bg3);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: .92rem;
      font-weight: 600;
      outline: none;
      transition: border .25s, box-shadow .25s;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .form-input.error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    .form-input::placeholder {
      color: var(--muted);
      opacity: .7;
    }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.1rem;
      padding: 4px;
      transition: color .2s;
    }

    .eye-btn:hover {
      color: var(--accent);
    }

    /* ── Alert messages ── */
    .alert {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: .85rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert.show {
      display: flex;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 2px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .alert-warn {
      background: rgba(245, 158, 11, 0.12);
      border: 2px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
    }

    /* ── Login button ── */
    .btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      border: none;
      cursor: pointer;
      transition: all .25s;
      letter-spacing: .3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.35);
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(79, 70, 229, 0.45);
    }

    .btn-login:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    .btn-login.loading .spinner {
      display: block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Footer note ── */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: .76rem;
      color: var(--muted);
      font-weight: 600;
    }

    .login-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px 26px;
      }
    }
  </style>
</head>

<body>
  <!-- Background blobs -->
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="themeBtn" title="Toggle theme">🌙</button>

  <!-- Login card -->
  <div class="login-wrap">
    <div class="login-card" id="loginCard">
      <div class="logo-area">
        <div class="logo-icon">🧠</div>
        <h1>Next<span>Gen</span>IT</h1>
        <p>AI Hub — Sign in to continue</p>
      </div>

      <!-- Error / Warning alerts -->
      <div class="alert alert-error" id="alertError">
        <span>⛔</span><span id="alertErrorMsg">Invalid username or password.</span>
      </div>
      <div class="alert alert-warn" id="alertWarn">
        <span>🔒</span><span id="alertWarnMsg">Your account has been deactivated. Please contact admin.</span>
      </div>

      <form id="loginForm" autocomplete="off" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" class="form-input" placeholder="Enter your username"
              autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input type="password" id="password" class="form-input" placeholder="Enter your password"
              autocomplete="current-password" required>
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show/hide password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <div class="spinner"></div>
          <span class="btn-text">Sign In →</span>
        </button>
      </form>

      <p class="login-footer">
        NextGenIT AI Hub &nbsp;·&nbsp; <a href="index.html">Back to Home</a>
      </p>
    </div>
  </div>

  <script>
    // ── Google Sheet published key ──
    const SHEET_KEY = '2PACX-1vRuberYeW5hQZ-DoJR-7-QrL7VjwAv_IB3ETi2XqVgPQE6tRFqqPFmc7MAnY-PJVUx3SteZ5Fqd6ppd';

    // ── JSONP fetcher (works from file:// — no CORS issues) ──
    function fetchSheet(sheetName) {
      return new Promise((resolve, reject) => {
        const cb = 'ngi_cb_' + Date.now();
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 12000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cb] = function (data) {
          cleanup();
          try {
            const cols = (data.table.cols || []).map(c => (c.label || c.id || '').trim());
            const rows = (data.table.rows || []).map(row => {
              const obj = {};
              cols.forEach((col, i) => {
                const cell = row.c && row.c[i];
                obj[col] = (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : '';
              });
              return obj;
            });
            resolve(rows);
          } catch (e) { reject(e); }
        };
        script.onerror = () => { cleanup(); reject(new Error('Script error')); };
        script.src = `https://docs.google.com/spreadsheets/d/e/${SHEET_KEY}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&callback=${cb}&t=${Date.now()}`;
        document.head.appendChild(script);
      });
    }

    // ── If already logged in, skip to updates ──
    if (sessionStorage.getItem('ngi_user')) {
      window.location.href = 'updates.html';
    }

    // ── Theme toggle ──
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('ngi_theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('ngi_theme', next);
      themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    // ── Password eye toggle ──
    const pwdInput = document.getElementById('password');
    document.getElementById('eyeBtn').addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      document.getElementById('eyeBtn').textContent = show ? '🙈' : '👁️';
    });

    // ── CSV parser (handles quoted commas) ──
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
      return lines.slice(1).map(line => {
        const vals = [];
        let cur = '', inQ = false;
        for (let ch of line) {
          if (ch === '"') { inQ = !inQ; }
          else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
          else { cur += ch; }
        }
        vals.push(cur.trim());
        const obj = {};
        headers.forEach((h, i) => obj[h] = (vals[i] || '').replace(/^"|"$/g, '').trim());
        return obj;
      });
    }

    // ── Show/hide alerts ──
    function showError(msg) {
      document.getElementById('alertWarn').classList.remove('show');
      document.getElementById('alertErrorMsg').textContent = msg;
      document.getElementById('alertError').classList.add('show');
    }
    function showWarn(msg) {
      document.getElementById('alertError').classList.remove('show');
      document.getElementById('alertWarnMsg').textContent = msg;
      document.getElementById('alertWarn').classList.add('show');
    }
    function hideAlerts() {
      document.getElementById('alertError').classList.remove('show');
      document.getElementById('alertWarn').classList.remove('show');
    }

    // ── Shake card ──
    function shakeCard() {
      const card = document.getElementById('loginCard');
      card.classList.remove('shake');
      void card.offsetWidth; // reflow
      card.classList.add('shake');
    }

    // ── Form submit ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlerts();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showError('Please enter both username and password.');
        shakeCard();
        return;
      }

      // Loading state
      const btn = document.getElementById('loginBtn');
      btn.classList.add('loading');
      btn.disabled = true;
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      try {
        // JSONP fetch — works from file:// with no CORS issues
        const rows = await fetchSheet('Login');

        // Match username (case-insensitive) and password (case-sensitive)
        const match = rows.find(r =>
          (r.Username || '').toLowerCase() === username.toLowerCase() &&
          r.Password === password
        );

        if (!match) {
          showError('Invalid username or password. Please try again.');
          shakeCard();
          document.getElementById('username').classList.add('error');
          document.getElementById('password').classList.add('error');
        } else if (match.Status && match.Status.trim().toLowerCase() !== 'active') {
          showWarn('Your account has been deactivated. Please contact the admin.');
          shakeCard();
        } else {
          // Save session
          sessionStorage.setItem('ngi_user', JSON.stringify({
            user_id: match.User_ID || '',
            full_name: match.Full_Name || username,
            username: match.Username,
            access_level: match.Access_Level || 'Student',
            status: match.Status
          }));
          // Redirect
          window.location.href = 'updates.html';
        }

      } catch (err) {
        showError('Could not connect to the login database. Please check your internet connection and try again.');
        shakeCard();
        console.error('Login fetch error:', err);
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // Clear error highlights on typing
    ['username', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error');
        hideAlerts();
      });
    });

    // Remove the old CSV parser (no longer needed)
  </script>
</body>

</html>
